<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 助教 · 承泽教育</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/ai-tutor.css">
</head>
<body>

  <!-- Navigation -->
  <header class="header" id="header">
    <div class="container header__inner">
      <a href="index.html" class="logo"><span class="logo__icon">&#9650;</span>承泽教育</a>
      <nav class="nav" id="nav">
        <ul class="nav__list">
          <li><a href="index.html#courses" class="nav__link">课程中心</a></li>
          <li><a href="ai-tutor.html" class="nav__link">AI 助教</a></li>
          <li><a href="index.html#features" class="nav__link">平台优势</a></li>
          <li><a href="index.html#about" class="nav__link">关于我们</a></li>
        </ul>
      </nav>
      <a href="index.html#contact" class="btn btn--primary nav-cta">立即报名</a>
      <button class="menu-toggle" id="menuToggle" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- AI Tutor Interface -->
  <div class="ai-page">

    <!-- Sidebar -->
    <aside class="ai-sidebar">
      <div class="ai-sidebar__header">
        <h3>学习助手</h3>
        <p>随时提问，快速解答</p>
      </div>

      <div class="ai-sidebar__suggestions">
        <div class="ai-suggestion-label">试试这些问题</div>
        <button class="ai-suggestion" data-query="虚拟语气有哪些用法？">虚拟语气有哪些用法？</button>
        <button class="ai-suggestion" data-query="专升本英语考试重点是什么？">专升本英语考试重点？</button>
        <button class="ai-suggestion" data-query="高数极限怎么求？">高数极限怎么求？</button>
        <button class="ai-suggestion" data-query="帮我写一段作文开头">帮我写一段作文开头</button>
        <button class="ai-suggestion" data-query="英语阅读理解技巧">英语阅读理解技巧</button>
        <button class="ai-suggestion" data-query="大学语文考试范围">大学语文考试范围</button>
      </div>

      <div class="ai-sidebar__info">
        <div class="ai-info-card">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>
          </svg>
          <span>AI 助教基于大语言模型，回答仅供参考</span>
        </div>
      </div>
    </aside>

    <!-- Chat Area -->
    <main class="ai-chat">
      <div class="chat-messages" id="chatMessages">
        <!-- Welcome message (inserted by JS) -->
      </div>

      <div class="chat-input-area">
        <form class="chat-input-form" id="chatForm">
          <input
            type="text"
            class="chat-input"
            id="chatInput"
            placeholder="输入你的学习问题..."
            autocomplete="off"
          >
          <button type="submit" class="chat-send-btn" id="chatSendBtn" aria-label="发送">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </form>
        <div class="chat-hint">按下 Enter 发送 · AI 助教保持在线</div>
      </div>
    </main>
  </div>

  <script src="js/ai-tutor.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
