  <path d="M66 72 L64 68 M74 70 L73 67" stroke="#2C1810" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M126 72 L128 68 M134 70 L135 67" stroke="#2C1810" stroke-width="1.5" stroke-linecap="round"/>
