  <ellipse cx="120" cy="88" rx="14" ry="16" fill="#fff"/>
  <ellipse cx="80" cy="88" rx="10" ry="13" fill="#3B5BDB"/>
  <ellipse cx="120" cy="88" rx="10" ry="13" fill="#3B5BDB"/>
  <ellipse cx="80" cy="86" rx="6" ry="8" fill="#2C1810"/>
  <ellipse cx="120" cy="86" rx="6" ry="8" fill="#2C1810"/>
  <!-- Eye shine -->
  <ellipse cx="85" cy="82" rx="3.5" ry="3" fill="#fff" opacity="0.8"/>
  <ellipse cx="125" cy="82" rx="3.5" ry="3" fill="#fff" opacity="0.8"/>
  <circle cx="78" cy="93" r="2" fill="#fff" opacity="0.5"/>
  <circle cx="118" cy="93" r="2" fill="#fff" opacity="0.5"/>
