<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大学英语精讲班 · 直播中</title>
  <link rel="stylesheet" href="/player/tcplayer.min.css">
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0f172a; color:#fff; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; min-height:100vh; }
    .topbar { display:flex; align-items:center; gap:12px; padding:12px 20px; border-bottom:1px solid rgba(255,255,255,.08); }
    .dot { width:8px; height:8px; border-radius:50%; background:#ef4444; animation:pulse 1.5s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    .label { color:#ef4444; font-size:13px; font-weight:700; }
    .course { font-size:15px; font-weight:600; }
    .back { margin-left:auto; color:rgba(255,255,255,.6); text-decoration:none; font-size:13px; }
    .wrap { max-width:1100px; margin:24px auto; padding:0 20px; }
    #player-container { width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; }
    .hint { margin-top:14px; color:rgba(255,255,255,.45); font-size:13px; }
  </style>
</head>
<body>
  <div class="topbar">
    <span class="dot"></span><span class="label">直播中</span><span class="course">大学英语精讲班</span>
    <a class="back" href="/live/student/courses/1">返回课程</a>
  </div>
  <div class="wrap">
    <div id="player-container"></div>
    <div class="hint">直播结束约 10-30 分钟后，可在课程页查看回放</div>
  </div>
  <script src="/player/tcplayer.min.js"></script>
  <script>
    var streamName = 'dadaqweqw';
    var playUrl = 'https://play.chengze.online/live/UYMPIV.flv';
    if (!playUrl) playUrl = 'https://play.chengze.online/live/' + streamName + '.flv';
    var mediaType = playUrl.indexOf('.flv') > -1 ? 'video/x-flv' : (playUrl.indexOf('.m3u8') > -1 ? 'application/x-mpegURL' : 'video/mp4');
    var player = TCPlayer('player-container', {
      sources: [{ src: playUrl, type: mediaType }],
      autoplay: true,
      controls: true
    });
  </script>
</body>
</html>
